name: Secure delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run reviewed static analysis rules
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          python -m pip install 'semgrep==1.186.0'
          semgrep scan --config .semgrep.yml --metrics off --error --strict
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: false
      - name: Enforce high and critical dependency findings
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .
      - name: Check deployment definitions
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run local API tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Build the public site
        working-directory: frontend
        env:
          STATIC_EXPORT: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Verify the public Worker in an isolated runtime
        working-directory: edge
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci
          npm run check
          node security-smoke.mjs
          npm exec -- wrangler deploy --dry-run --outdir ../release/worker
      - name: Package the tested site and Worker
        run: |
          mkdir -p release/site
          cp -a frontend/out/. release/site/
          cp edge/wrangler.jsonc release/
          tar -czf vektr-worker-and-site.tar.gz -C release .
          sha256sum vektr-worker-and-site.tar.gz > vektr-worker-and-site.tar.gz.sha256
          npm sbom --prefix frontend --sbom-format cyclonedx > frontend.cdx.json
          npm sbom --prefix edge --sbom-format cyclonedx > edge.cdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-vektr
          path: |
            vektr-worker-and-site.tar.gz
            vektr-worker-and-site.tar.gz.sha256
            frontend.cdx.json
            edge.cdx.json
          if-no-files-found: error

  attest:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [source, verify]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download and verify the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$GH_RUN_ID" --name verified-vektr
          sha256sum -c vektr-worker-and-site.tar.gz.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: vektr-worker-and-site.tar.gz
